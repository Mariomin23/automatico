<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Hunter AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🎯 Job Hunter AI</h1>
  <div class="header-right">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-label" id="statusLabel">Comprobando Ollama...</span>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="sidebar-section">
      <button class="run-btn" id="runBtn" onclick="startRun()">
        ▶ Nueva búsqueda
      </button>
      <div class="sidebar-label">Historial</div>
    </div>
    <div class="date-list" id="dateList">
      <div style="padding: 8px 8px; font-size: 12px; color: #4b5563;">Cargando...</div>
    </div>
  </aside>

  <main id="main">
    <div class="empty-state" id="emptyState">
      <div class="icon">📋</div>
      <p>Selecciona una fecha o lanza una nueva búsqueda</p>
    </div>
  </main>
</div>

<!-- Modal run en vivo -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">⚙️ Ejecutando búsqueda...</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="log-area" id="logArea"></div>
    <div class="modal-footer">
      <button class="btn-modal-close" onclick="closeModal()">Cerrar</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
